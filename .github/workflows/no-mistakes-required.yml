name: Require no-mistakes
run-name: "Manual local-validation attestation check for PR #${{ inputs.pull_request }}"

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number to inspect
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    name: PR must be raised via no-mistakes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the trusted verifier
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Verify exact-head local validation
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pull_request }}
        run: |
          set -eu
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > "$RUNNER_TEMP/pr.json"
          jq -er '.body | select(type == "string")' "$RUNNER_TEMP/pr.json" > "$RUNNER_TEMP/pr-body.md"
          head=$(jq -er '.head.sha | select(type == "string")' "$RUNNER_TEMP/pr.json")
          bin/fm-no-mistakes-attestation.sh "$head" < "$RUNNER_TEMP/pr-body.md"
